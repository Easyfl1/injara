services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: injara
      POSTGRES_PASSWORD: injara
      POSTGRES_DB: injara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U injara"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    environment:
      PROCESS_ROLE: app
      DATABASE_URL: postgresql://injara:injara@postgres:5432/injara?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_MODE: polling
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]

  worker:
    build: .
    env_file: .env
    environment:
      PROCESS_ROLE: worker
      WORKER_SEND_ENABLED: "true"
      DATABASE_URL: postgresql://injara:injara@postgres:5432/injara?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/index.js"]

volumes:
  pgdata:
  redisdata:
